<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>VFX.LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&family=Potta+One&family=Rampart+One&family=Reggae+One&family=RocknRoll+One&family=Sofia+Sans+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: dark stage in the middle, library left, inspector right, timeline docked under the stage */
  --ink:#0b0c13; --panel:#11121c; --panel2:#181a28; --raise:#20233a; --line:#272b40;
  --text:#e8eaf6; --mute:#8389ab; --dim:#565c7c;
  --accent:#ff4d7e; --cyan:#59e0ff;
  --c-particles:#ffb54d; --c-ribbon:#59e0ff; --c-mesh:#c59bff; --c-screen:#ff7a9e; --c-occluder:#98a2cc; --c-media:#6fe0a8; --c-manga:#efe6d2; --c-text:#ff9f5a;
  --display:"Dela Gothic One","Arial Black",sans-serif;
  --ui:"Sofia Sans Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --gut:136px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font:14px/1.3 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2a2e47;border-radius:4px}::-webkit-scrollbar-track{background:transparent}

#app{height:100%;display:grid;grid-template-columns:248px minmax(0,1fr) 318px;grid-template-rows:46px minmax(0,1fr) 248px;grid-template-areas:"top top top" "lib stage insp" "tl tl insp"}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.logo{font-family:var(--display);font-size:17px;letter-spacing:.06em;line-height:1;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.logo b{font-weight:400;background:linear-gradient(90deg,#ff4d7e,#ffb54d);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-family:var(--ui);font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--mute)}
#projName{flex:1 1 120px;min-width:60px;max-width:260px;background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 8px;font-weight:600;user-select:text;-webkit-user-select:text}
#projName:hover,#projName:focus{border-color:var(--line);background:var(--ink)}
.sp{flex:1}
.btn{height:30px;padding:0 11px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--raise)} .btn:disabled{opacity:.35;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#16040a}
.btn.sm{height:26px;padding:0 8px;font-size:13px}
.btn.ico{width:30px;padding:0;justify-content:center}
.btn.on{border-color:var(--cyan);color:var(--cyan)}

#lib,#insp{background:var(--panel);overflow-y:auto;overflow-x:hidden;min-height:0}
#lib{grid-area:lib;border-right:1px solid var(--line)}
#insp{grid-area:insp;border-left:1px solid var(--line)}
.sec{padding:12px 12px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 9px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;justify-content:space-between}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.preset{position:relative;height:46px;border-radius:8px;border:1px solid var(--line);overflow:hidden;text-align:left;padding:0 8px 6px;display:flex;align-items:flex-end;font-weight:700;font-size:13px;line-height:1.05;text-shadow:0 1px 6px #000}
.preset i{position:absolute;inset:0;opacity:.85;z-index:0}
.preset span{position:relative;z-index:1}
.preset:hover{border-color:var(--text)} .preset.user{height:34px;align-items:center;padding:0 8px;background:var(--panel2);text-shadow:none}
.preset .x{position:absolute;right:4px;top:4px;z-index:2;width:20px;height:20px;border-radius:5px;background:#0008;color:var(--mute);font-size:12px}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.add{height:40px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:600;text-align:left;padding:0 10px;display:flex;align-items:center;gap:8px}
.add:hover{background:var(--raise)} .dot{width:9px;height:9px;border-radius:3px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{height:25px;padding:0 9px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.chip:hover{background:var(--raise)}
.plist{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.prow{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:7px;background:var(--panel2);border:1px solid transparent;font-weight:600;text-align:left;width:100%}
.prow.sel{border-color:var(--cyan)} .prow small{margin-left:auto;color:var(--mute);font-family:var(--mono);font-size:11px;font-weight:400}
.note{color:var(--mute);font-size:12.5px;line-height:1.35;margin:0}

#stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:#07080d;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#handles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.h,.hm{position:absolute;pointer-events:auto;touch-action:none;transform:translate(-50%,-50%);border-radius:50%}
.h{width:15px;height:15px;background:var(--ink);border:2.5px solid var(--cyan);cursor:grab}
.h::after{content:"";position:absolute;inset:-9px}
.h.sel{background:var(--cyan);box-shadow:0 0 0 4px #59e0ff33}
.h.first{border-radius:3px}
.hm{width:9px;height:9px;background:#59e0ff55;border:1px solid var(--cyan);cursor:copy}
.hm::after{content:"";position:absolute;inset:-7px}
.tools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.seg{display:flex;background:#11121ccc;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;backdrop-filter:blur(8px)}
.seg button{height:28px;padding:0 10px;border-radius:6px;font-weight:600;font-size:13px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--text)} .seg button.on.hot{background:var(--accent);color:#16040a}
.views{position:absolute;right:10px;top:10px}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#11121ce6;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px;max-width:calc(100% - 24px);text-align:center;pointer-events:none}
#hint:empty{display:none}
#stats{position:absolute;left:10px;bottom:9px;font:11px var(--mono);color:var(--dim);pointer-events:none}
#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute)}

#tl{grid-area:tl;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tbar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.tbar .time{font:600 13px var(--mono);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.tbar label{color:var(--mute);font-size:12.5px;display:flex;align-items:center;gap:5px}
.tbar select,.tbar input[type=number]{height:28px}
#tlBody{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.ruler{position:sticky;top:0;z-index:3;height:24px;background:var(--panel);border-bottom:1px solid var(--line);display:flex}
.gutter{width:var(--gut);flex:none}
.rtrack{position:relative;flex:1;cursor:ew-resize;touch-action:none;margin-right:12px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font:10px var(--mono);color:var(--dim);padding:5px 0 0 3px}
.tick.minor{top:16px;border-color:#1c1f31}
.row{display:flex;height:30px;border-bottom:1px solid #1a1c2b;align-items:stretch}
.row.sel{background:#181a28}
.rlab{width:var(--gut);flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 8px;font-weight:600;font-size:13px;min-width:0;cursor:pointer}
.rlab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.row.off .nm{color:var(--dim);text-decoration:line-through}
.eye{width:22px;height:22px;border-radius:5px;color:var(--mute);flex:none;display:grid;place-items:center}
.eye:hover{background:var(--raise);color:var(--text)}
.track{position:relative;flex:1;margin-right:12px;touch-action:none}
.bar{position:absolute;top:5px;bottom:5px;border-radius:5px;min-width:6px;cursor:grab;opacity:.82;touch-action:none}
.bar::before,.bar::after{content:"";position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize}
.bar::before{left:0}.bar::after{right:0;border-right:2px solid #fff8;border-radius:0 5px 5px 0}
.row.sel .bar{opacity:1;box-shadow:0 0 0 1.5px #fff}
.tailb{position:absolute;top:13px;height:4px;border-radius:2px;opacity:.35;pointer-events:none}
#playhead{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--accent);z-index:4;pointer-events:none}
#playhead::before{content:"";position:absolute;left:-6px;top:0;border:5.5px solid transparent;border-top:8px solid var(--accent)}

/* inspector */
.ihead{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;position:sticky;top:0;background:var(--panel);z-index:2}
.ihead .ty{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.ihead .acts{display:flex;gap:6px;flex-wrap:wrap}
.tin{width:100%;height:30px;background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-weight:600;user-select:text;-webkit-user-select:text}
details.grp{border-bottom:1px solid var(--line)}
details.grp>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:7px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .12s}
details.grp[open]>summary::before{transform:rotate(45deg)}
details.grp[open]>summary{color:var(--text)}
.fields{padding:0 12px 12px;display:flex;flex-direction:column;gap:7px}
.f{display:grid;grid-template-columns:98px minmax(0,1fr);align-items:center;gap:8px;min-height:26px}
.f>label{color:#b4b9d6;font-size:13px;line-height:1.1}
.f.col{grid-template-columns:1fr;gap:5px}
.ctl{display:flex;align-items:center;gap:6px;min-width:0}
input[type=number],.num{width:58px;flex:none;height:26px;background:var(--ink);border:1px solid var(--line);border-radius:5px;padding:0 5px;font:12px var(--mono);font-variant-numeric:tabular-nums;text-align:right;-moz-appearance:textfield;user-select:text;-webkit-user-select:text;touch-action:none;cursor:ew-resize}
input[type=number]:focus{cursor:text;border-color:var(--cyan);outline:0}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ctl.multi input[type=number]{flex:1;width:0;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:26px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--raise)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--raise)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--text);margin-top:-5px;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--text);border:0}
select{height:26px;background:var(--ink);border:1px solid var(--line);border-radius:5px;padding:0 5px;flex:1;min-width:0;font-size:13px}
input[type=color]{width:38px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--ink);flex:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0}
.gradbar{position:relative;height:24px;border-radius:5px;border:1px solid var(--line);cursor:copy;touch-action:none}
.stops{position:relative;height:16px;margin:0 0 2px;touch-action:none}
.stop{position:absolute;top:0;width:12px;height:14px;transform:translateX(-50%);border-radius:2px 2px 6px 6px;border:2px solid var(--ink);box-shadow:0 0 0 1px var(--mute);cursor:ew-resize;touch-action:none}
.stop.sel{box-shadow:0 0 0 2px var(--text)}
.curve{width:100%;height:78px;display:block;background:var(--ink);border:1px solid var(--line);border-radius:5px;touch-action:none;cursor:crosshair}
.cchips{display:flex;gap:4px;flex-wrap:wrap}
.cchips button{height:20px;padding:0 7px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;color:var(--mute)}
.cchips button:hover{color:var(--text)}
.tip{margin:10px 12px 0;padding:8px 10px;border-radius:7px;background:#161a2e;border:1px solid var(--line);color:#b9c0e2;font-size:12.5px;line-height:1.35}
.looks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.look{border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:0 0 5px;overflow:hidden;font-size:11.5px;font-weight:600;line-height:1.1;display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:center}
.look i{display:block;height:22px}
.look:hover{border-color:var(--mute)} .look.on{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 1px var(--accent)}
details.sub{margin-top:10px} details.sub>summary{cursor:pointer;color:var(--mute);font-size:12.5px;font-weight:600;list-style:none}
details.sub>summary::-webkit-details-marker{display:none} details.sub>summary::before{content:"+ "} details.sub[open]>summary::before{content:"– "}
.chip.pal{display:inline-flex;align-items:center;gap:6px;padding:0 9px 0 6px} .chip.pal i{width:11px;height:11px;border-radius:50%}
.mrow{cursor:default;height:36px;padding:0 4px 0 5px} .mrow img,.mrow .vid{width:28px;height:28px;border-radius:5px;object-fit:cover;flex:none;background:#0008}
.mrow .vid{display:grid;place-items:center;font:600 9px var(--mono);color:var(--mute)} .mrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow small{margin-left:0} .mini{height:24px;padding:0 7px;border-radius:5px;background:var(--raise);font-size:12px;font-weight:600;flex:none}
.mini:hover{background:#2c3050}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;padding:10px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.opt:hover{border-color:var(--cyan)} .opt b{font-size:14px} .opt span{color:var(--mute);font-size:12.5px;line-height:1.3}
.hp{position:absolute;pointer-events:auto;touch-action:none;width:15px;height:15px;transform:translate(-50%,-50%) rotate(45deg);background:var(--accent);border:2px solid #fff;border-radius:3px;cursor:move}
.hp::after{content:"";position:absolute;inset:-9px}
#stage.drop::after{content:"Drop to import";position:absolute;inset:10px;border:2px dashed var(--cyan);border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:16px;background:#0b0c13cc;pointer-events:none}
.empty{padding:22px 16px;color:var(--mute);line-height:1.45}
.empty b{color:var(--text)}
.warn{margin:0 12px 10px;padding:8px 10px;border-radius:7px;background:#3a2a10;border:1px solid #6b4a14;color:#ffd699;font-size:12.5px}

#tabs{grid-area:tabs;display:none;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#tabs button{flex:1;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border-bottom:2px solid transparent}
#tabs button.on{color:var(--text);border-color:var(--accent)}

.menu{position:fixed;z-index:30;min-width:210px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px;box-shadow:0 14px 40px #000a;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;font-weight:600}
.menu button:hover{background:var(--raise)} .menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#modal{position:fixed;inset:0;z-index:40;background:#05060bcc;display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.dlg{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:16px} .dlg textarea{width:100%;height:220px;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px;font:11px var(--mono);resize:vertical;user-select:text;-webkit-user-select:text}
.dlg .rowb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);z-index:50;background:var(--text);color:var(--ink);font-weight:700;padding:8px 14px;border-radius:9px;opacity:0;transition:.18s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#rec{position:absolute;right:10px;bottom:10px;display:none;align-items:center;gap:7px;font-weight:700;color:var(--accent)}
#rec::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}

@media (max-width:880px){
  :root{--gut:128px}
  .seg button{height:26px;padding:0 8px;font-size:12.5px}
  .tools{left:8px;top:8px;gap:5px}
  .rlab{font-size:12.5px;gap:5px;padding-left:6px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:44px minmax(210px,41%) 38px minmax(0,1fr);grid-template-areas:"top" "stage" "tabs" "panel"}
  #lib,#insp,#tl{grid-area:panel;display:none;border:0}
  body[data-tab=lib] #lib,body[data-tab=insp] #insp{display:block}
  body[data-tab=tl] #tl{display:flex}
  #tabs{display:flex}
  .logo span,.hide-s{display:none}
  .f{grid-template-columns:92px minmax(0,1fr)}
  input[type=number]{height:30px} .f{min-height:30px}
  .row{height:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-tab="tl">
<div id="app">
  <header id="top">
    <div class="logo"><b>VFX.LAB</b><span>STYLIZED 3D EFFECTS</span></div>
    <input id="projName" type="text" aria-label="Effect name" spellcheck="false">
    <div class="sp"></div>
    <button class="btn ico" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7a3.5 3.5 0 010 7H6M3 6l3-3M3 6l3 3"/></svg></button>
    <button class="btn ico" id="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6H6a3.5 3.5 0 000 7h4M13 6l-3-3M13 6l-3 3"/></svg></button>
    <button class="btn pri" id="exportBtn">Export</button>
  </header>

  <aside id="lib" aria-label="Library"></aside>

  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="handles"></div>
    <div id="nogl">This studio needs WebGL 2. Open it in a current Chrome, Safari, Firefox or Edge.</div>
    <div class="tools">
      <div class="seg" id="toolSeg">
        <button data-tool="orbit" class="on" title="Orbit the camera (V)">Orbit</button>
        <button data-tool="draw" title="Draw a path in 3D (D)">Draw path</button>
      </div>
      <div class="seg" id="planeSeg" style="display:none">
        <button data-plane="ground" class="on" title="Draw on the floor">Floor</button>
        <button data-plane="wall" title="Draw on an upright plane facing you">Wall</button>
        <button data-plane="screen" title="Draw on a plane facing the camera">Camera</button>
      </div>
      <div class="seg" id="viewSeg">
        <button data-view="bloom" class="on" title="Glow">Glow</button>
        <button data-view="grid" class="on" title="Floor grid">Grid</button>
        <button data-view="paths" class="on" title="Show paths">Paths</button>
        <button data-view="dummy" title="1.75 m reference figure">Figure</button>
        <button data-view="frame" title="Reset the camera">Reframe</button>
      </div>
    </div>
    <div id="hint"></div>
    <div id="stats"></div>
    <div id="rec">Recording</div>
  </main>

  <nav id="tabs" aria-label="Panels">
    <button data-tab="tl" class="on">Timeline</button>
    <button data-tab="insp">Inspector</button>
    <button data-tab="lib">Library</button>
  </nav>

  <aside id="insp" aria-label="Inspector"></aside>

  <footer id="tl">
    <div class="tbar">
      <button class="btn ico" id="rew" title="Back to start" aria-label="Back to start"><svg width="13" height="13" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="2" width="2" height="10"/><path d="M13 2v10L5 7z"/></svg></button>
      <button class="btn ico pri" id="play" title="Play / pause (Space)" aria-label="Play or pause"></button>
      <button class="btn sm on" id="loopBtn" title="Loop playback">Loop</button>
      <span class="time" id="timeNow">0.00</span>
      <label>of <input type="number" id="durIn" min="0.2" max="30" step="0.1" aria-label="Duration in seconds"> s</label>
      <label class="hide-s">Speed <select id="speedSel" aria-label="Playback speed"><option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
      <div class="sp"></div>
      <button class="btn sm" id="addBtn">+ Layer</button>
    </div>
    <div id="tlBody">
      <div class="ruler"><div class="gutter"></div><div class="rtrack" id="rtrack"></div></div>
      <div id="rows"></div>
      <div id="playhead"></div>
    </div>
  </footer>
</div>

<div class="menu" id="menu"></div>
<div id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<input type="file" id="mediaIn" accept="image/*,video/*" multiple hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/engine.js"></script>
<script src="js/presets.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
